version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hftpass}
      POSTGRES_DB: polymarket_hft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hft -d polymarket_hft"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Main Bot ───────────────────────────────────────────────────────────────

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://hft:${POSTGRES_PASSWORD:-hftpass}@postgres:5432/polymarket_hft
      - NO_DASHBOARD=1  # disable Rich TUI in container (no TTY)
    volumes:
      - ./STOP:/app/STOP:ro  # mount STOP file for kill switch
      - bot_logs:/app/logs
    ports:
      - "9090:9090"  # Prometheus metrics
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── WebSocket Bridge ──────────────────────────────────────────────────────

  ws-bridge:
    build: .
    restart: unless-stopped
    command: python ws_bridge.py
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - WS_BRIDGE_HOST=0.0.0.0
      - WS_BRIDGE_PORT=8765
    ports:
      - "8765:8765"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend ───────────────────────────────────────────────────────────────

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - ws-bridge
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8765
    ports:
      - "3001:3000"

  # ── Optional: Kronos GPU service ──────────────────────────────────────────
  # Uncomment if you have a GPU and want to run Kronos as a separate microservice
  # kronos:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.kronos
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   environment:
  #     - KRONOS_MODEL_SIZE=small
  #   ports:
  #     - "8001:8001"

  # ── Monitoring stack (optional) ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring

volumes:
  postgres_data:
  bot_logs:
  prometheus_data:
  grafana_data:
